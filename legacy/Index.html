<style>
/* Layout: one phone column for students (max 540px); teacher view widens to a projector grid. Palette is Wordle's own: white page, black ink, green / yellow / gray tiles. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F6F7F8; --line:#D3D6DA; --line2:#878A8C; --fg:#1A1A1B; --fg2:#4A4B4D; --fg3:#787C7E;
  --accent:#6AAA64; --accent-ink:#FFFFFF; --data:#1A1A1B; --data2:#6AAA64;
  --ok:#6AAA64; --ok-ink:#FFFFFF; --near:#C9B458; --near-ink:#FFFFFF; --no:#787C7E; --no-ink:#FFFFFF; --key:#D3D6DA; --bad:#B3261E;
  --font:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121213; --panel:#121213; --panel2:#1E1E20; --line:#3A3A3C; --line2:#565758; --fg:#F8F8F8; --fg2:#C8C9CB; --fg3:#818384;
  --accent:#538D4E; --accent-ink:#FFFFFF; --data:#D7DADC; --data2:#538D4E;
  --ok:#538D4E; --ok-ink:#FFFFFF; --near:#B59F3B; --near-ink:#FFFFFF; --no:#3A3A3C; --no-ink:#FFFFFF; --key:#818384; --bad:#FF7B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121213; --panel:#121213; --panel2:#1E1E20; --line:#3A3A3C; --line2:#565758; --fg:#F8F8F8; --fg2:#C8C9CB; --fg3:#818384;
  --accent:#538D4E; --accent-ink:#FFFFFF; --data:#D7DADC; --data2:#538D4E;
  --ok:#538D4E; --ok-ink:#FFFFFF; --near:#B59F3B; --near-ink:#FFFFFF; --no:#3A3A3C; --no-ink:#FFFFFF; --key:#818384; --bad:#FF7B6B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font);line-height:1.1;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,7.5vw,40px);font-weight:800}
h2{font-size:clamp(22px,5.5vw,28px);font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:12px 40px}
.app.wide{max-width:1180px}
.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand b{font-weight:800;font-size:22px;letter-spacing:.01em}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.muted{color:var(--fg2)}.small{font-size:14px}.tiny{font-size:12.5px;color:var(--fg3)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:600;font-size:16px;background:var(--panel);color:var(--fg);border:1px solid var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}.btn.sm{min-height:38px;padding:0 14px;font-size:14px}.btn.ghost{border-color:var(--line)}
input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;min-height:46px;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg2);min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--fg);border-color:var(--near);background:color-mix(in oklab,var(--near) 22%,var(--panel))}.pill.bad{color:var(--bad);border-color:var(--bad)}
.notice{border-left:4px solid var(--near);padding:10px 12px;background:var(--panel2);font-size:14px}
.notice.info{border-color:var(--accent)}
.err{border-left:4px solid var(--bad);padding:10px 12px;background:var(--panel2);font-size:14px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
/* grid + tiles */
.grid{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(100%,330px);margin:0 auto}
.grid .r{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);font-weight:800;font-size:clamp(24px,7.5vw,32px);text-transform:uppercase;position:relative;background:var(--panel);color:var(--fg)}
.tile.filled{border-color:var(--line2)}
.tile.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.tile.near{background:var(--near);border-color:var(--near);color:var(--near-ink)}
.tile.no{background:var(--no);border-color:var(--no);color:var(--no-ink)}
.tile .sym{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:600;opacity:.85}
.tile.sm{font-size:17px}
.tile.sm .sym{font-size:8px;right:2px;bottom:0}
.kb{display:flex;flex-direction:column;gap:6px;user-select:none}
.kb .kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:43px;min-height:54px;border-radius:4px;background:var(--key);color:var(--fg);font-weight:800;font-size:14px;display:grid;place-items:center}
.key.wide{max-width:66px;flex:1.5;font-size:11px}
.key.ok{background:var(--ok);color:var(--ok-ink)}
.key.near{background:var(--near);color:var(--near-ink)}
.key.no{background:var(--no);color:var(--no-ink)}
.hint{background:var(--panel2);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;border-radius:var(--r)}
.hint b{flex:none;font-weight:800}
.hint.locked{color:var(--fg3)}
.timer{font-weight:800;font-size:26px;letter-spacing:-.01em}
.timer.low{color:var(--bad)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:800;font-size:14px;z-index:20;pointer-events:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:54px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:22px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;display:inline-block}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.stat div{background:var(--panel2);padding:10px;min-width:0;border-radius:var(--r)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12.5px;color:var(--fg3)}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:var(--font);fill:var(--fg2);font-size:12px}
svg .axis{stroke:var(--line2)}
svg .gridl{stroke:var(--line);stroke-dasharray:2 4}
svg .dot{fill:var(--data);fill-opacity:.7;stroke:var(--bg);stroke-width:1.5}
svg .dot.many{fill-opacity:.28;stroke:none}
svg .dot.sel{fill:var(--data2);fill-opacity:1;stroke:var(--fg);stroke-width:2}
svg .dot.mark{fill:var(--near);fill-opacity:1;stroke:var(--fg);stroke-width:1.5}
svg .mean{stroke:var(--data2);stroke-width:3}
svg .trend{stroke:var(--data2);stroke-width:3;fill:none}
svg .lab{fill:var(--fg);font-weight:800}
svg .bar{fill:var(--data2)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.wordinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wordinfo .card{min-width:0}
.wordinfo .w{font-weight:800;font-size:26px;letter-spacing:.1em}
.ask{display:flex;flex-direction:column;gap:8px}
.ask div{padding:10px 12px;background:var(--panel2);border-left:4px solid var(--accent)}
.big{font-weight:800;font-size:clamp(36px,7vw,84px);line-height:1;letter-spacing:-.02em}
.present{font-size:20px}
.present h2{font-size:clamp(28px,4.2vw,50px)}
.present h3{font-size:clamp(20px,2.4vw,30px)}
.present p,.present li{font-size:clamp(17px,2vw,24px);line-height:1.4}
.present .ask div{font-size:clamp(17px,2vw,24px)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cols>*{min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg3);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tablewrap{overflow-x:auto}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--panel2);padding:2px 6px;border-radius:4px}
.codebig{font-weight:800;font-size:clamp(40px,8vw,96px);letter-spacing:.12em}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.live>*{min-width:0}
.mini{display:flex;flex-wrap:wrap;gap:4px}
.mini span{width:30px;height:30px;display:grid;place-items:center;font-size:12px;font-weight:800;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.mini span.done{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
.mini span.fail{background:var(--no);color:var(--no-ink);border-color:var(--no)}
.wrap li{margin-bottom:8px}
</style>

function score(guess, answer){
  const res=Array(answer.length).fill('no'); const left={};
  for(let i=0;i<answer.length;i++){ if(guess[i]===answer[i]) res[i]='ok'; else left[answer[i]]=(left[answer[i]]||0)+1; }
  for(let i=0;i<answer.length;i++){ if(res[i]==='ok') continue; const c=guess[i]; if(left[c]>0){ res[i]='near'; left[c]--; } }
  return res;
}

function summarize(attempts){
  const g={A:[],B:[]}; attempts.forEach(a=>{ if(g[a.puzzle]) g[a.puzzle].push(a); });
  const out={};
  for(const k of ['A','B']){ const a=g[k]; out[k]={n:a.length, solveRate:a.length?a.filter(x=>x.solved).length/a.length:null, avgDiff:mean(a.map(x=>x.difficulty)), avgHelp:mean(a.map(x=>x.helpful)), avgGuesses:mean(a.map(x=>x.guesses)), avgTime:mean(a.map(x=>x.elapsed)), rows:a}; }
  return out;
}
function dotPlot(attempts, pid, opts={}){
  const sum=summarize(attempts); const W=opts.w||520,H=opts.h||300,L=44,R=16,T=18,B=44;
  const y=v=>T+(5-v)/4*(H-T-B); const xs={A:L+(W-L-R)*0.27, B:L+(W-L-R)*0.73};
  let dots='';
  for(const k of ['A','B']){
    const byVal={}; sum[k].rows.forEach(a=>{ (byVal[a.difficulty]=byVal[a.difficulty]||[]).push(a); });
    Object.entries(byVal).forEach(([v,arr])=>arr.forEach((a,i)=>{ const off=(i-(arr.length-1)/2)*13; dots+=`<circle class="dot ${a.participantId===pid?'sel':''}" cx="${xs[k]+off}" cy="${y(+v)}" r="6"><title>Puzzle ${k}: rated ${v}, ${a.solved?'solved':'not solved'} in ${a.guesses} guesses</title></circle>`; }));
    if(sum[k].avgDiff!=null) dots+=`<line class="mean" x1="${xs[k]-50}" x2="${xs[k]+50}" y1="${y(sum[k].avgDiff)}" y2="${y(sum[k].avgDiff)}"/><text x="${xs[k]+54}" y="${y(sum[k].avgDiff)+4}" class="lab">avg ${sum[k].avgDiff.toFixed(1)}</text>`;
  }
  const grid=[1,2,3,4,5].map(v=>`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dot plot of difficulty ratings by puzzle">${grid}<line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/>
    <text x="${xs.A}" y="${H-B+20}" text-anchor="middle" class="lab">Puzzle A (n=${sum.A.n})</text><text x="${xs.B}" y="${H-B+20}" text-anchor="middle" class="lab">Puzzle B (n=${sum.B.n})</text>
    <text x="12" y="${T+(H-T-B)/2}" transform="rotate(-90 12 ${T+(H-T-B)/2})" text-anchor="middle">Rated difficulty (1 easy → 5 hard)</text>${dots}</svg>`;
}
function ols(pts){ const n=pts.length; if(n<2) return null; const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1])); let sxy=0,sxx=0; pts.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)*(x-mx);}); if(!sxx) return null; const b=sxy/sxx; return {b,a:my-b*mx}; }
const AXES={fam:{label:'How familiar the word is (1 rare → 5 common; real word-frequency data)',min:1,max:5,chip:'Familiarity'}, help:{label:'Average hint helpfulness (1 → 5; simulated)',min:1,max:5,chip:'Hint helpfulness'}, vowels:{label:'Vowel count (A E I O U; real)',min:0,max:5,chip:'Vowels'}, repeats:{label:'Repeated-letter count (real)',min:0,max:3,chip:'Repeated letters'}, rare:{label:'Rare letters in the word (J Q X Z V K W; real)',min:0,max:3,chip:'Rare letters'}};
function hashJ(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%997; return h/997-0.5; }
function scatter(xKey, trend, sel, marks, opts={}){
  const W=opts.w||520,H=opts.h||340,L=44,R=16,T=18,B=48; const ax=AXES[xKey];
  const x=v=>L+(v-ax.min)/(ax.max-ax.min)*(W-L-R); const y=v=>T+(5-v)/4*(H-T-B);
  const fit=ols(WORDS.map(s=>[s[xKey],s.diff])); const isCat=!['fam','help'].includes(xKey);
  const jit=s=>isCat? hashJ(s.word)*(W-L-R)/(ax.max-ax.min)*0.55 : 0;
  const jy=s=>isCat? hashJ(s.word+'y')*8 : 0;
  let dots=WORDS.map(s=>`<circle class="dot many" data-w="${s.word}" cx="${(x(s[xKey])+jit(s)).toFixed(1)}" cy="${(y(s.diff)+jy(s)).toFixed(1)}" r="4"><title>${s.word}</title></circle>`).join('');
  (marks||[]).forEach(m=>{ const s=WORDS.find(w=>w.word===m); if(s) dots+=`<circle class="dot mark" data-w="${s.word}" cx="${(x(s[xKey])+jit(s)).toFixed(1)}" cy="${(y(s.diff)+jy(s)).toFixed(1)}" r="7"><title>${s.word}</title></circle><text x="${(x(s[xKey])+jit(s)+9).toFixed(1)}" y="${(y(s.diff)+jy(s)-6).toFixed(1)}" class="lab">${s.word}</text>`; });
  if(sel){ const s=WORDS.find(w=>w.word===sel); if(s) dots+=`<circle class="dot sel" data-w="${s.word}" cx="${(x(s[xKey])+jit(s)).toFixed(1)}" cy="${(y(s.diff)+jy(s)).toFixed(1)}" r="8"><title>${s.word}</title></circle>`; }
  const xt=isCat?Array.from({length:ax.max-ax.min+1},(_,i)=>ax.min+i):[1,2,3,4,5];
  const grid=[1,2,3,4,5].map(v=>`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')+xt.map(v=>`<text x="${x(v)}" y="${H-B+18}" text-anchor="middle">${v}</text>`).join('');
  const cl=v=>Math.max(1,Math.min(5,v));
  const line=trend&&fit?`<line class="trend" x1="${x(ax.min)}" y1="${y(cl(fit.a+fit.b*ax.min))}" x2="${x(ax.max)}" y2="${y(cl(fit.a+fit.b*ax.max))}"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatterplot of 1,000 Wordle answer words" id="scat">${grid}<line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/><line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
   <text x="${L+(W-L-R)/2}" y="${H-10}" text-anchor="middle" class="lab">${ax.label}</text><text x="12" y="${T+(H-T-B)/2}" transform="rotate(-90 12 ${T+(H-T-B)/2})" text-anchor="middle">Average rated difficulty (1 → 5; simulated)</text>${dots}${line}</svg>`;
}
const EXPLAIN={
  fam:'More familiar words tend to get lower difficulty ratings. The pattern is strong but not perfect: find a common word that still rated hard.',
  help:'Puzzles with more helpful hints tend to rate easier, with plenty of exceptions. Remember this axis is simulated: these 1,000 words have no real hints.',
  vowels:'Vowel count on its own shows almost no pattern. Not every feature matters.',
  repeats:'Repeated letters lean a little harder, but the dots overlap a lot. A weak, unclear relationship.',
  rare:'Words with J, Q, X, Z, V, K or W lean harder, but most words have none, so the comparison rests on a small group.'
};

function simExplainer(){
  return `<div class="card stack"><h3>What "simulated data" means</h3>

}

    else rows.push(`<div class="r">${'<div class="tile"></div>'.repeat(5)}</div>`);
  }
  const ks={}; S.guesses.forEach(g=>[...g.w].forEach((c,i)=>{ const v=g.r[i]; const rank={ok:3,near:2,no:1}; if(!ks[c]||rank[v]>rank[ks[c]]) ks[c]=v; }));
  const kb=['QWERTYUIOP','ASDFGHJKL','⏎ZXCVBNM⌫'].map(r=>`<div class="kr">${[...r].map(c=>c==='⏎'?`<button class="key wide" data-k="ENTER">ENTER</button>`:c==='⌫'?`<button class="key wide" data-k="BACK" aria-label="Backspace">⌫</button>`:`<button class="key ${ks[c]||''}" data-k="${c}">${c}</button>`).join('')}</div>`).join('');
  const quit = S.over? '' : S.confirmQuit? `<div class="notice stack"><b>Give up?</b><span class="small">This ends your game and shows the word. It counts as "not solved."</span><div class="row"><button class="btn sm" id="quitYes">Yes, show me the word</button><button class="btn sm primary" id="quitNo">Keep playing</button></div></div>` : `<button class="btn ghost block sm" id="giveup">Give up (ends the game, reveals the word)</button>`;
  return `<div class="row spread"><h3 style="margin:0">Guess the word</h3><div class="timer num ${S.left<=20?'low':''}" id="timer" aria-live="polite">${mmss(S.left)}</div></div>

  <div class="hint ${S.hintsShown<2?'locked':''}"><b>Hint 2</b><span>${S.hintsShown>=2?esc(p.hint2):'Unlocks after two misses.'}</span></div>
  <div class="grid" id="grid" aria-label="guesses">${rows.join('')}</div>
  <div class="small" style="min-height:22px;text-align:center;font-weight:600" id="msg" aria-live="assertive">${S.over?esc(S.endMsg||''):''}</div>
  ${S.over?`<button class="btn primary block" id="toRate">${S.solved?'Solved! Rate it':'Rate it'}</button>`:`<div class="kb" id="kb">${kb}</div>${quit}`}`;
}

function bindSim(st,re){
  $app.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{st.xAxis=b.dataset.x; re();}));
  $app.querySelector('#trend')?.addEventListener('click',()=>{st.trend=!st.trend; re();});
  const sv=$app.querySelector('#scat'); if(sv) sv.addEventListener('click',e=>{ const c=e.target.closest('[data-w]'); if(!c) return; st.sel=st.sel===c.dataset.w?null:c.dataset.w; st.find=st.sel||''; re(); });
  const f=$app.querySelector('#findw'); if(f) f.addEventListener('input',e=>{ const v=e.target.value.toUpperCase().replace(/[^A-Z]/g,''); st.find=v; const m=$app.querySelector('#findmsg'); if(v.length===5){ if(WORDS.some(w=>w.word===v)){ st.sel=v; re(); $app.querySelector('#findw')?.focus(); } else if(m) m.textContent='Not in these 1,000 answers.'; } else if(m) m.textContent=''; });
}
async function start(){
  const day=parseInt(S.day,10);
  if(!(day>=1&&day<=31)){ S.error='Enter the day of the month you were born, 1 to 31.'; rerender(); return; }
  if(!S.code.trim()){ S.error='Enter the class code.'; rerender(); return; }
  S.error=null; S.submitting=true; rerender();
  try{ S.session=unwrap(await call(API.getSession,S.code.trim())); const key=day%2===0?'A':'B'; S.puzzle=Object.assign({key},S.session.puzzles[key]); S.puzzle.word=S.puzzle.word.toUpperCase(); S.pid=pidGet(); S.step='example'; }
  catch(e){ S.error=e.message||String(e); }
  S.submitting=false; render(); window.scrollTo(0,0);
}
function tick(){
  const el=Math.floor((Date.now()-S.startAt)/1000); S.left=Math.max(0,TIME_LIMIT-el);
  const t=$app.querySelector('#timer'); if(t){ t.textContent=mmss(S.left); t.classList.toggle('low',S.left<=20); }
  if(S.left<=0) finish(false,"Time's up.");
}
let toastT=null;
function toast(msg){ let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},1400); }
function key(k){
  if(S.over) return;
  if(k==='BACK'){ S.cur=S.cur.slice(0,-1); }
  else if(k==='ENTER'){
    if(S.cur.length<5){ toast('Not enough letters'); shake(); return; }
    if(!DICT.has(S.cur)){ toast('Not in word list'); shake(); return; }
    const r=score(S.cur,S.puzzle.word); S.guesses.push({w:S.cur,r}); S.cur='';
    if(r.every(x=>x==='ok')) return finish(true,'');
    if(S.guesses.length>=2&&S.hintsShown<2){ S.hintsShown=2; toast('Hint 2 unlocked'); }
    if(S.guesses.length>=MAX_GUESSES) return finish(false,'Out of guesses.');
    sendProgress();
  }
  else if(/^[A-Z]$/.test(k)&&S.cur.length<5){ S.cur+=k; }
  rerender();
}
function shake(){ const g=$app.querySelector('#grid'); if(g) g.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220}); }
function finish(solved,msg){
  if(S.over) return; clearInterval(S.timer); S.over=true; S.solved=solved; S.confirmQuit=false;
  S.elapsed=Math.min(TIME_LIMIT,Math.round((Date.now()-S.startAt)/1000));
  S.endMsg = solved? ['Genius','Magnificent','Impressive','Splendid','Great','Phew'][S.guesses.length-1]+'! Solved in '+S.guesses.length+'.' : `${msg} The word was ${S.puzzle.word}.`;
  rerender(); sendProgress();
}
function sendProgress(){ if(!S.puzzle||!S.pid) return; const row={participantId:S.pid, puzzle:S.puzzle.key, guesses:S.guesses.length, solved:S.solved, done:S.over, elapsed:Math.min(TIME_LIMIT,Math.round((Date.now()-S.startAt)/1000)), hintsShown:S.hintsShown}; API.progress(S.code.trim(),row).catch(()=>{}); }
document.addEventListener('keydown',e=>{ if(S.step!=='play'||S.over||S.confirmQuit) return; if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key; if(k==='Enter') key('ENTER'); else if(k==='Backspace') key('BACK'); else if(/^[a-zA-Z]$/.test(k)) key(k.toUpperCase()); });
async function submit(){
  if(S.submitting) return; S.submitting=true; rerender();
  const row=Object.assign({participantId:S.pid, puzzle:S.puzzle.key, word:S.puzzle.word, guesses:S.guesses.length, solved:S.solved, elapsed:S.elapsed, hintsShown:S.hintsShown, difficulty:S.difficulty, helpful:S.helpful, submittedAt:new Date().toISOString()}, features(S.puzzle.word));
  try{ unwrap(await call(API.submitAttempt,S.code.trim(),row)); S.step='results'; S.results=null; render(); window.scrollTo(0,0); pollResults(); }
  catch(e){ S.error='Could not save ('+(e.message||e)+'). Check your connection and tap again.'; }
  S.submitting=false; rerender();
}
let pollTimer=null;
async function pollResults(){
  clearTimeout(pollTimer); if(S.step!=='results') return;
  try{ const first=!S.results; S.results=unwrap(await call(API.getResults,S.code.trim())); S.error=null; if(first||S.resultsTab==='class') rerender(); }
  catch(e){ if(!S.results){ S.error='Could not load results: '+(e.message||e); rerender(); } }
  pollTimer=setTimeout(pollResults,5000);
}

  q('#t2reset')?.addEventListener('click',()=>{T.t2=TIME_LIMIT;T.t2run=false; rerenderT();});
  if(T.tab==='setup'){
    $app.querySelectorAll('[data-use]').forEach(b=>b.addEventListener('click',async()=>{ T.code=b.dataset.use; await loadResults(); T.puzzles=T.results.puzzles; T.stage=T.results.stage||1; renderT(); }));
    q('#create')?.addEventListener('click',async()=>{ try{ const r=unwrap(await call(API.admin,'create',{code:q('#newcode').value,name:q('#newname').value,puzzles:readPuzzles()})); T.code=r.code; await loadT(); await loadResults(); T.puzzles=T.results.puzzles; T.msg=`Class ${r.code} created.`; }catch(e){ T.err=e.message||String(e); } renderT(); });
    q('#savep')?.addEventListener('click',async()=>{ const p=readPuzzles(); for(const k of ['A','B']){ if(!DICT.has(p[k].word)){ T.err=`Puzzle ${k}: "${p[k].word}" is not in Wordle's word list, so students could never guess it. Pick another.`; renderT(); return; } } T.saving=true; renderT(); try{ unwrap(await call(API.admin,'savePuzzles',{code:T.code,puzzles:p})); T.puzzles=p; T.msg='Saved.'; T.err=null; }catch(e){ T.err=e.message||String(e); } T.saving=false; renderT(); });
    q('#clear')?.addEventListener('click',async()=>{ try{ unwrap(await call(API.admin,'clear',{code:T.code})); await loadResults(); await loadT(); T.msg='Responses cleared.'; }catch(e){ T.err=e.message||String(e); } renderT(); });
    q('#reseed')?.addEventListener('click',async()=>{ await call(API.admin,'reseed',{}); T.code='DEMO'; await loadT(); await loadResults(); T.puzzles=T.results.puzzles; T.msg='Demo data restored.'; renderT(); });
    $app.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('change',()=>{ T.puzzles=readPuzzles(); rerenderT(); }));
  }
  if(T.tab==='present'){ bindSim(T,rerenderT); if(T.stage===1) drawQR(); }
}
function readPuzzles(){ const p=JSON.parse(JSON.stringify(T.puzzles||DEFAULT_PUZZLES)); $app.querySelectorAll('[data-p]').forEach(i=>{ const [k,f]=i.dataset.p.split('.'); p[k][f]=f==='word'?i.value.toUpperCase().replace(/[^A-Z]/g,''):i.value; }); return p; }
function rerenderT(){ const y=window.scrollY; renderT(); window.scrollTo(0,y); }
function tTick(){
  if(T.t10run) T.t10++;
  if(T.t2run&&T.t2>0){ T.t2--; if(T.t2===0) T.t2run=false; }
  const a=$app.querySelector('#t10'); if(a) a.textContent=mmss(T.t10);
  const b=$app.querySelector('#t2'); if(b){ b.textContent=mmss(T.t2); b.classList.toggle('low',T.t2<=20); }
  const c=$app.querySelector('#t2big'); if(c) c.textContent=mmss(T.t2);
}
function drawQR(){
  const box=$app.querySelector('#qrbox'); if(!box||!T.url) return;
  const url=T.url+(T.url.includes('?')?'&':'?')+'code='+encodeURIComponent(T.code);
  const go=()=>{ box.innerHTML=''; box.style.cssText='background:#fff;padding:10px;display:inline-block'; try{ new QRCode(box,{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ box.innerHTML=''; } };
  if(window.QRCode) go(); else { const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload=go; s.onerror=()=>{box.innerHTML='';}; document.head.appendChild(s); }
}
async function loadT(){ const r=unwrap(await call(API.admin,'list',{})); T.sessions=r.sessions; T.url=r.url||''; }
async function loadResults(){ if(!T.code) return; T.results=unwrap(await call(API.getResults,T.code)); }
let tPoll=null;
async function pollT(){ clearTimeout(tPoll); if(T.code){ try{ await loadResults(); if(T.tab==='present'&&[2,3,4,7].includes(T.stage)) rerenderT(); if(T.tab==='data') rerenderT(); }catch(e){} } tPoll=setTimeout(pollT, T.stage===2?3000:4000); }
async function bootT(){
  renderT();
  try{ await loadT(); T.code=BOOT.code||(T.sessions[0]&&T.sessions[0].code)||''; if(T.code){ await loadResults(); T.puzzles=T.results.puzzles; T.stage=T.results.stage||1; } else T.tab='setup'; }
  catch(e){ T.err='Not authorized or backend unreachable: '+(e.message||e); }
  renderT(); if(T.tab==='present'&&T.stage===1) drawQR(); setInterval(tTick,1000); pollT();
}

if(BOOT.mode==='teach') bootT(); else { if(BOOT.code) S.code=BOOT.code.toUpperCase(); render(); }
})();
</script>
